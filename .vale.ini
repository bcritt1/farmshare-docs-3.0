# Prose lint. Rules live in styles/FarmShare.
# Error-level rules block a merge; warning-level rules are for a reviewer to judge.
StylesPath = styles
MinAlertLevel = suggestion

[formats]
md = md

[*.md]
BasedOnStyles = FarmShare
# Skip MkDocs macros like {{ facts.home_quota }}
TokenIgnores = (\{\{[^}]*\}\})
