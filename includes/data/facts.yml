# Single source for numbers and names used on the site.
# Use them in pages as {{ facts.home_quota }}, etc.
# Values marked "unverified" still need confirming with staff.
facts:
  support_email: srcc-support@stanford.edu
  login_host: login.farmshare.stanford.edu
  ondemand_url: https://ondemand.farmshare.stanford.edu
  dtn_host: dtn.farmshare.stanford.edu
  announce_channel: "#farmshare-announce"
  announce_url: https://stanford.enterprise.slack.com/archives/C018K0RR3GU
  users_channel: "#farmshare-users"
  users_url: https://stanford.enterprise.slack.com/archives/C018638T170
  home_quota: 50 GB        # verified: staff give 48 GiB (~51 GB) in support replies
  home_quota_du: 48G       # how the limit shows in `du -sh` output (GiB)
  purge_days: 90           # verified by user
  default_runtime: 2 hours
  max_runtime: 2 days
  long_max_runtime: 7 days
  interactive_max_runtime: 1 day  # per the FarmShare admin's draft docs
  scratch_path: /scratch/users/$USER   # verified: $SCRATCH is not set
  cuda_module: cuda/12.9.0
  qos:
    interactive: {cpus: 16, mem: 64G, jobs: 4}
    dev: {max_time: 8 hours, cpus: 8, mem: 32G, jobs: 1}
    long: {max_time: 7 days, cpus: 128, running_jobs: 4, submitted_jobs: 32}
    bigmem: {mem: 1.5 TB, running_jobs: 4}
    gpu: {gpus: 4, running_jobs: 4, submitted_jobs: 32}
    normal: {cpus: 512, gpus: 1, running_jobs: 128, submitted_jobs: 1024}
  gpu_nodes: 6
  gpus_per_node: 4
  gpu_model: NVIDIA L40S
  ondemand_apps: [FarmShare Desktop, Caddyshack Desktop, JupyterLab, MATLAB, RStudio, VS Code]
