# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
#
# FarmShare docs 3.0. Setup follows stanford-rc/www.sherlock.stanford.edu.
#
# To move or rename the repo, change only site_url, repo_url, repo_name
# and edit_uri below. Nothing else hard-codes the owner or URL.

site_name:        FarmShare
site_description: User documentation for FarmShare, Stanford's cluster for coursework and unsponsored research.
site_url:         https://bcritt1.github.io/farmshare-docs-3.0/

repo_name: bcritt1/farmshare-docs-3.0
repo_url:  https://github.com/bcritt1/farmshare-docs-3.0
edit_uri:  edit/main/src/

copyright: >-
  Copyright &copy; 2026 &mdash;
  <a href='mailto:srcc-support@stanford.edu'>Stanford Research Computing</a>

docs_dir: src
site_dir: site

validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: info

theme:
  name: material
  language: en
  features:
    - content.annotations
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.path
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/farmshare.css

extra:
  generator: false
  social:
    - icon: fontawesome/solid/earth-americas
      link: https://srcc.stanford.edu
      name: Stanford Research Computing
    - icon: fontawesome/brands/slack
      link: https://stanford.enterprise.slack.com/archives/C018638T170
      name: "#farmshare-users on Stanford Slack"

plugins:
  - search
  - macros:
      on_error_fail: true
      include_yaml:
        - includes/data/facts.yml
  - redirects:
      redirect_maps: {}
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: "#"
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: false
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [includes]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

