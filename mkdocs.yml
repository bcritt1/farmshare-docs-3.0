      - Log in for the first time: get-started/first-login.md
      - Run your first job: get-started/first-job.md
      - Where to put your files: get-started/where-to-put-files.md
      - Coming from Sherlock: get-started/coming-from-sherlock.md
  - Use FarmShare:
      - Work in your browser:
          - Start a desktop: use/start-a-desktop.md
          - Use JupyterLab: use/jupyterlab.md
          - Use RStudio: use/rstudio.md
          - Use VS Code: use/vs-code.md
          - Run GUI programs: use/gui-programs.md
          - Use Caddyshack for EE courses: use/caddyshack.md
