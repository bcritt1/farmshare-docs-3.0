          - Stata: software/licensed/stata.md
          - Ansys and HFSS: software/licensed/ansys.md
          - SAS: software/licensed/sas.md
          - Mathematica: software/licensed/mathematica.md
          - Gurobi: software/licensed/gurobi.md
